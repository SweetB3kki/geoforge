[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geoforge"
version = "0.1.0"
description = "OpenStreetMap to a local, engine-independent world scene"
requires-python = ">=3.12"
dependencies = [
  "osmnx>=2.0,<3", "geopandas>=1.0,<2", "shapely>=2.0,<3",
  "pyproj>=3.6,<4", "pydantic>=2.10,<3", "matplotlib>=3.9,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
elevation = ["rasterio>=1.4,<2"]
multisource = ["overturemaps>=1.0.2,<2", "duckdb>=1.5,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "black>=25,<27"]

[project.scripts]
geoforge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: accesses live geographic data services"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]
line-length = 88
